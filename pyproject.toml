[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "proteus-gateway"
version = "0.2.0"
description = "Many agents, one gateway. Serve any number of agents from a single stateless, model-agnostic process."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "John Sackey" }]
keywords = ["llm", "agent", "gateway", "openai-compatible", "sse", "tools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32,<1.0",
    "litellm>=1.55,<2.0",
    "asyncpg>=0.30,<1.0",
    "httpx>=0.27,<1.0",
    "python-dotenv>=1.0,<2.0",
    "redis>=5.0,<6.0",
    "croniter>=2.0,<6.0",
    "orjson>=3.10,<4.0",
    "pyyaml>=6.0,<7.0",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.40"]
tui = ["textual>=0.60"]
all = ["playwright>=1.40", "textual>=0.60"]

[project.urls]
Homepage = "https://github.com/hijacker-mills/proteus"
Source = "https://github.com/hijacker-mills/proteus"

[project.scripts]
proteus = "app.cli:run"

[tool.setuptools]
packages = ["app", "app.cli", "app.tools", "app.tools.custom", "app.memory", "app.channels"]

[tool.setuptools.package-data]
app = ["prompts/*.md", "*.md"]
